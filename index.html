<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Апелляции</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            min-height: 100vh;
        }

        .header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #202832;
            background: #0e131a;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #9ba6b2;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .card {
            background: #111720;
            border: 1px solid #252e39;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .description {
            color: #9ba6b2;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            background: #0b1016;
            border: 1px solid #303b48;
            border-radius: 8px;
            color: white;
            padding: 13px;
            margin-bottom: 20px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: #5865f2;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 14px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #151c25;
            display: none;
        }

        .status.success {
            display: block;
            border: 1px solid #248046;
        }

        .status.error {
            display: block;
            border: 1px solid #ed4245;
        }

        .status-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .status-check {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #252e39;
        }

        .status-check h2 {
            margin-bottom: 10px;
        }

        .status-check .description {
            margin-bottom: 20px;
        }

        .check-row {
            display: flex;
            gap: 10px;
        }

        .check-row input {
            flex: 1;
            margin-bottom: 0;
        }

        .check-row button {
            width: auto;
            padding: 13px 30px;
            background: #2b2d42;
        }

        .check-row button:hover {
            background: #3d405b;
        }

        .status-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #151c25;
            display: none;
        }

        .status-result.visible {
            display: block;
        }

        .footer {
            text-align: center;
            color: #687481;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .check-row {
                flex-direction: column;
            }

            .check-row button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>📝 Апелляции</h1>
        <p>Подайте апелляцию, если считаете наказание несправедливым</p>
    </header>

    <main class="container">

        <div class="card">

            <h2>Подать апелляцию</h2>

            <p class="description">
                Заполните форму ниже. Ваша апелляция будет рассмотрена администрацией.
            </p>

            <form id="appealForm">

                <label for="discord">Discord ID</label>
                <input type="text" id="discord" placeholder="Например: 123456789012345678" required>

                <label for="nickname">Discord ник</label>
                <input type="text" id="nickname" placeholder="Например: Rishat" required>

                <label for="reason">Причина апелляции</label>
                <textarea id="reason" placeholder="Расскажите, почему вы хотите обжаловать наказание..." required></textarea>

                <button type="submit" id="submitBtn">Отправить апелляцию</button>

            </form>

            <div id="status" class="status">
                <div class="status-title" id="statusTitle"></div>
                <div id="statusText"></div>
            </div>

            <!-- ========================================== -->
            <!-- БЛОК ПРОВЕРКИ СТАТУСА                      -->
            <!-- ========================================== -->
            <div class="status-check">

                <h2>🔍 Проверить статус</h2>

                <p class="description">
                    Введите номер апелляции, чтобы узнать её статус.
                </p>

                <div class="check-row">
                    <input type="text" id="checkNumber" placeholder="Например: AP-000001">
                    <button onclick="checkStatus()">Проверить</button>
                </div>

                <div id="statusResult" class="status-result">
                    <div id="statusResultContent"></div>
                </div>

            </div>

        </div>

    </main>

    <footer class="footer">
        Система апелляций
    </footer>

    <script>
        // ==========================================
        // НАСТРОЙКА API
        // ==========================================
        const API_URL = 'https://appeal-site-production.up.railway.app';

        // ==========================================
        // ОТПРАВКА АПЕЛЛЯЦИИ
        // ==========================================
        const form = document.getElementById('appealForm');
        const statusBox = document.getElementById('status');
        const statusTitle = document.getElementById('statusTitle');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const discord = document.getElementById('discord').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const reason = document.getElementById('reason').value.trim();

            if (!discord || !nickname || !reason) {
                showStatus('error', 'Ошибка', 'Пожалуйста, заполните все поля.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                const response = await fetch(`${API_URL}/api/appeals`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        discord: discord,
                        nickname: nickname,
                        punishment: 'Не указано',
                        reason: reason
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showStatus(
                        'success',
                        '✅ Апелляция отправлена!',
                        `Ваш номер: <strong>${result.appealNumber}</strong><br>Скопируйте его, чтобы проверить статус.`
                    );
                    form.reset();
                } else {
                    showStatus('error', '❌ Ошибка', result.message || 'Не удалось отправить апелляцию.');
                }

            } catch (error) {
                console.error('Ошибка:', error);
                showStatus(
                    'error',
                    '❌ Ошибка соединения',
                    'Не удалось связаться с сервером. Проверьте подключение.'
                );
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить апелляцию';
            }
        });

        function showStatus(type, title, text) {
            statusBox.className = `status ${type}`;
            statusTitle.textContent = title;
            statusText.innerHTML = text;
        }

        // ==========================================
        // ПРОВЕРКА СТАТУСА
        // ==========================================
        async function checkStatus() {
            const number = document.getElementById('checkNumber').value.trim();
            const resultDiv = document.getElementById('statusResult');
            const contentDiv = document.getElementById('statusResultContent');

            if (!number) {
                resultDiv.style.display = 'block';
                resultDiv.style.border = '1px solid #ed4245';
                contentDiv.innerHTML = '❌ Введите номер апелляции';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/appeals/${number}`);
                const result = await response.json();

                resultDiv.style.display = 'block';

                if (result.success) {
                    const appeal = result.appeal;
                    let statusText = '🟡 На рассмотрении';
                    let statusColor = '#f0b400';

                    if (appeal.status === 'approved') {
                        statusText = '🟢 Одобрена';
                        statusColor = '#57f287';
                    } else if (appeal.status === 'rejected') {
                        statusText = '🔴 Отклонена';
                        statusColor = '#ed4245';
                    }

                    resultDiv.style.border = `1px solid ${statusColor}`;
                    contentDiv.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 10px;">
                            Статус: <span style="color: ${statusColor};">${statusText}</span>
                        </div>
                        <div style="color: #9ba6b2; margin-bottom: 5px;">
                            📝 Причина: ${appeal.reason || '—'}
                        </div>
                        <div style="color: #9ba6b2; margin-bottom: 5px;">
                            📌 Решение: ${appeal.decision_reason || 'Ожидает'}
                        </div>
                        <div style="color: #9ba6b2;">
                            👤 Модератор: ${appeal.moderator_username || '—'}
                        </div>
                    `;
                } else {
                    resultDiv.style.border = '1px solid #ed4245';
                    contentDiv.innerHTML = '❌ Апелляция не найдена. Проверьте номер.';
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.style.border = '1px solid #ed4245';
                contentDiv.innerHTML = '❌ Ошибка соединения с сервером';
            }
        }
    </script>

</body>
</html>
