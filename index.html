<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Nexus Support — Ticket System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #05080f;
            color: #f0f4ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(ellipse at 20% 30%, #0d1a2b, #05080f 70%);
        }

        .glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 30px 0 20px;
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #8892a8;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background: #4a5568;
            transition: all 0.3s ease;
        }

        .status-dot.online { background: #57f287; box-shadow: 0 0 12px rgba(87, 242, 135, 0.4); }
        .status-dot.offline { background: #ed4245; box-shadow: 0 0 12px rgba(237, 66, 69, 0.4); }

        .header .badge {
            display: inline-block;
            background: rgba(88, 101, 242, 0.15);
            color: #8b9aff;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 1.5px;
            padding: 6px 18px;
            border-radius: 100px;
            border: 1px solid rgba(88, 101, 242, 0.25);
            backdrop-filter: blur(4px);
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff 0%, #8b9aff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #8892a8;
            font-size: 17px;
            margin-top: 10px;
            font-weight: 400;
        }

        .card {
            background: rgba(16, 24, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 40px 36px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .card:hover {
            border-color: rgba(88, 101, 242, 0.2);
            box-shadow: 0 40px 80px -20px rgba(88, 101, 242, 0.15);
        }

        .card h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .card .description {
            color: #8892a8;
            font-size: 15px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #b0bbd4;
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            background: rgba(10, 16, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #f0f4ff;
            padding: 14px 18px;
            margin-bottom: 22px;
            outline: none;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: 0.25s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #5865f2;
            background: rgba(10, 16, 26, 0.8);
            box-shadow: 0 0 0 4px rgba(88, 101, 242, 0.1);
        }

        select option { background: #111720; }

        textarea { min-height: 120px; resize: vertical; }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 4px 14px rgba(88, 101, 242, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .btn-secondary {
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.04);
            color: #f0f4ff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .status {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            display: none;
            border: 1px solid transparent;
        }

        .status.success { display: block; border-color: rgba(87, 242, 135, 0.25); background: rgba(87, 242, 135, 0.04); }
        .status.error { display: block; border-color: rgba(237, 66, 69, 0.25); background: rgba(237, 66, 69, 0.04); }

        .status-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }

        .divider {
            margin: 30px 0;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
        }

        .check-row {
            display: flex;
            gap: 12px;
        }

        .check-row input { flex: 1; margin-bottom: 0; }

        .status-result {
            margin-top: 20px;
            padding: 18px 22px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-result.visible { display: block; }

        .ticket-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .ticket-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(88, 101, 242, 0.2);
        }

        .ticket-item .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 4px;
        }

        .ticket-item .ticket-subject {
            font-weight: 600;
            font-size: 16px;
        }

        .ticket-item .ticket-status {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.06);
        }

        .ticket-item .ticket-status.open { color: #57f287; }
        .ticket-item .ticket-status.in_progress { color: #f0b400; }
        .ticket-item .ticket-status.closed { color: #ed4245; }

        .ticket-item .ticket-meta {
            color: #8892a8;
            font-size: 13px;
            margin-top: 4px;
        }

        .footer {
            text-align: center;
            color: #3d4659;
            padding: 30px 0;
            font-size: 14px;
        }

        .footer span { color: #5865f2; }

        @media (max-width: 600px) {
            .header h1 { font-size: 30px; }
            .card { padding: 28px 20px; }
            .check-row { flex-direction: column; }
            .btn-secondary { width: 100%; text-align: center; }
            .header-top { justify-content: center; }
            .ticket-item .ticket-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">

        <header class="header">
            <div class="header-top">
                <div class="status-badge">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">Проверка...</span>
                </div>
            </div>
            <div class="badge">✦ Nexus Support</div>
            <h1>Служба поддержки</h1>
            <p>Обращайтесь, мы всегда на связи</p>
        </header>

        <!-- ===== СОЗДАНИЕ ТИКЕТА ===== -->
        <div class="card">
            <h2>📩 Создать обращение</h2>
            <p class="description">Заполните форму, и наш саппорт свяжется с вами.</p>

            <form id="ticketForm">
                <label for="userId">Discord ID</label>
                <input type="text" id="userId" placeholder="123456789012345678" required />

                <label for="userName">Discord ник</label>
                <input type="text" id="userName" placeholder="Rishat" required />

                <label for="subject">Тема обращения</label>
                <input type="text" id="subject" placeholder="Кратко опишите проблему" required />

                <label for="priority">Приоритет</label>
                <select id="priority">
                    <option value="low">🟢 Низкий</option>
                    <option value="medium" selected>🟡 Средний</option>
                    <option value="high">🔴 Высокий</option>
                </select>

                <!-- ===== КАТЕГОРИЯ (НОВОЕ) ===== -->
                <label for="category">Категория обращения</label>
                <select id="category" required>
                    <option value="technical">🖥️ Техническая проблема</option>
                    <option value="financial">💳 Финансовый вопрос</option>
                    <option value="gameplay">🎮 Игровой вопрос</option>
                    <option value="moderation">🛡️ Модерация</option>
                    <option value="other">📌 Другое</option>
                </select>

                <label for="message">Сообщение</label>
                <textarea id="message" placeholder="Опишите вашу проблему подробно..." required></textarea>

                <button type="submit" class="btn-primary" id="submitBtn">📨 Отправить обращение</button>
            </form>

            <div id="status" class="status">
                <div class="status-title" id="statusTitle"></div>
                <div id="statusText"></div>
            </div>
        </div>

        <!-- ===== ПРОВЕРКА СТАТУСА ===== -->
        <div class="card">
            <h2>🔍 Проверить статус</h2>
            <p class="description">Введите номер тикета (TK-000001) или ваш Discord ID.</p>

            <div class="check-row">
                <input type="text" id="checkNumber" placeholder="TK-000001 или Discord ID" />
                <button class="btn-secondary" onclick="checkTicket()">Проверить</button>
            </div>

            <div id="statusResult" class="status-result">
                <div id="statusResultContent"></div>
            </div>
        </div>

        <footer class="footer">
            <span>✦</span> Nexus Support • Круглосуточная поддержка <span>✦</span>
        </footer>
    </div>

    <script>
        const API_URL = 'https://appeal-site-production.up.railway.app';

        // ===== СТАТУС =====
        async function checkServerStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            try {
                const response = await fetch(`${API_URL}/`, { signal: AbortSignal.timeout(5000) });
                if (response.ok) {
                    dot.className = 'status-dot online';
                    text.textContent = 'Онлайн';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Офлайн';
                }
            } catch {
                dot.className = 'status-dot offline';
                text.textContent = 'Офлайн';
            }
        }
        checkServerStatus();
        setInterval(checkServerStatus, 30000);

        // ===== ОТПРАВКА ТИКЕТА =====
        const form = document.getElementById('ticketForm');
        const statusBox = document.getElementById('status');
        const statusTitle = document.getElementById('statusTitle');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const userId = document.getElementById('userId').value.trim();
            const userName = document.getElementById('userName').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();
            const priority = document.getElementById('priority').value;
            const category = document.getElementById('category').value; // ← КАТЕГОРИЯ

            if (!userId || !userName || !subject || !message) {
                showStatus('error', 'Ошибка', 'Заполните все поля.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';

            try {
                const response = await fetch(`${API_URL}/api/tickets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userId, 
                        userName, 
                        subject, 
                        message, 
                        priority,
                        category  // ← ОТПРАВЛЯЕМ КАТЕГОРИЮ
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('success', '✅ Обращение создано!',
                        `Номер: <strong style="font-size:24px;color:#5865f2;">${result.ticketNumber}</strong><br>Сохраните его для проверки статуса.`
                    );
                    form.reset();
                } else {
                    showStatus('error', '❌ Ошибка', result.message || 'Не удалось отправить.');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showStatus('error', '❌ Ошибка соединения', 'Сервер временно недоступен.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📨 Отправить обращение';
            }
        });

        function showStatus(type, title, text) {
            statusBox.className = `status ${type}`;
            statusTitle.textContent = title;
            statusText.innerHTML = text;
        }

        // ===== ПРОВЕРКА ТИКЕТА =====
        async function checkTicket() {
            const input = document.getElementById('checkNumber').value.trim();
            const resultDiv = document.getElementById('statusResult');
            const contentDiv = document.getElementById('statusResultContent');

            if (!input) {
                resultDiv.style.display = 'block';
                resultDiv.style.border = '1px solid #ed4245';
                contentDiv.innerHTML = '❌ Введите номер тикета или Discord ID';
                return;
            }

            try {
                let url;
                let isUserId = /^\d+$/.test(input) && input.length > 10;

                if (isUserId) {
                    url = `${API_URL}/api/tickets/user/${input}`;
                } else {
                    url = `${API_URL}/api/tickets/${input}`;
                }

                const response = await fetch(url);
                const result = await response.json();

                resultDiv.style.display = 'block';

                if (result.success) {
                    if (Array.isArray(result.tickets)) {
                        if (result.tickets.length === 0) {
                            contentDiv.innerHTML = '📭 У вас пока нет обращений.';
                            return;
                        }
                        let html = '<div style="margin-bottom:12px;font-weight:600;">📋 Ваши обращения:</div>';
                        result.tickets.forEach(t => {
                            const statusMap = {
                                'open': '🟢 Открыт',
                                'in_progress': '🟡 В работе',
                                'closed': '🔴 Закрыт'
                            };
                            const catNames = {
                                'technical': '🖥️ Техническая',
                                'financial': '💳 Финансы',
                                'gameplay': '🎮 Игровой',
                                'moderation': '🛡️ Модерация',
                                'other': '📌 Другое'
                            };
                            html += `
                                <div class="ticket-item">
                                    <div class="ticket-header">
                                        <span class="ticket-subject">${t.subject}</span>
                                        <span class="ticket-status ${t.status}">${statusMap[t.status] || t.status}</span>
                                    </div>
                                    <div class="ticket-meta">
                                        ${t.ticket_number} • ${catNames[t.category] || t.category} • ${new Date(t.created_at).toLocaleDateString('ru-RU')}
                                        ${t.assigned_name ? `• 🛠️ ${t.assigned_name}` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        contentDiv.innerHTML = html;
                    } else {
                        const t = result.ticket;
                        const statusMap = {
                            'open': '🟢 Открыт',
                            'in_progress': '🟡 В работе',
                            'closed': '🔴 Закрыт'
                        };
                        const catNames = {
                            'technical': '🖥️ Техническая проблема',
                            'financial': '💳 Финансовый вопрос',
                            'gameplay': '🎮 Игровой вопрос',
                            'moderation': '🛡️ Модерация',
                            'other': '📌 Другое'
                        };
                        contentDiv.innerHTML = `
                            <div style="font-weight:600;margin-bottom:8px;">📌 ${t.subject}</div>
                            <div style="color:#8892a8;margin-bottom:4px;">Номер: ${t.ticket_number}</div>
                            <div style="color:#8892a8;margin-bottom:4px;">Статус: ${statusMap[t.status] || t.status}</div>
                            <div style="color:#8892a8;margin-bottom:4px;">Категория: ${catNames[t.category] || t.category}</div>
                            <div style="color:#8892a8;margin-bottom:4px;">Приоритет: ${t.priority || 'средний'}</div>
                            <div style="color:#8892a8;margin-bottom:8px;">Сообщение: ${t.message || '—'}</div>
                            ${t.assigned_name ? `<div style="color:#8892a8;">🛠️ Модератор: ${t.assigned_name}</div>` : ''}
                            ${t.closed_at ? `<div style="color:#8892a8;">🔒 Закрыт: ${new Date(t.closed_at).toLocaleDateString('ru-RU')}</div>` : ''}
                        `;
                    }
                    resultDiv.style.border = '1px solid rgba(87, 242, 135, 0.25)';
                } else {
                    resultDiv.style.border = '1px solid #ed4245';
                    contentDiv.innerHTML = '❌ Ничего не найдено. Проверьте номер или ID.';
                }
            } catch (error) {
                console.error('Ошибка проверки:', error);
                resultDiv.style.display = 'block';
                resultDiv.style.border = '1px solid #ed4245';
                contentDiv.innerHTML = '❌ Ошибка соединения с сервером.';
            }
        }
    </script>

</body>
</html>
