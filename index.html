<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Nexus Appeals — Premium System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #05080f;
            color: #f0f4ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(ellipse at 20% 30%, #0d1a2b, #05080f 70%);
        }

        .glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ===== ШАПКА ===== */
        .header {
            text-align: center;
            padding: 30px 0 20px;
            position: relative;
        }

        /* Верхняя строка: статус справа */
        .header-top {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        /* Индикатор статуса */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #8892a8;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background: #4a5568;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.online {
            background: #57f287;
            box-shadow: 0 0 12px rgba(87, 242, 135, 0.4);
        }

        .status-dot.offline {
            background: #ed4245;
            box-shadow: 0 0 12px rgba(237, 66, 69, 0.4);
        }

        .status-text {
            color: #b0bbd4;
        }

        .header .badge {
            display: inline-block;
            background: rgba(88, 101, 242, 0.15);
            color: #8b9aff;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 1.5px;
            padding: 6px 18px;
            border-radius: 100px;
            border: 1px solid rgba(88, 101, 242, 0.25);
            backdrop-filter: blur(4px);
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff 0%, #8b9aff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #8892a8;
            font-size: 17px;
            margin-top: 10px;
            font-weight: 400;
        }

        /* ===== КАРТОЧКА ===== */
        .card {
            background: rgba(16, 24, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 40px 36px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(88, 101, 242, 0.2);
            box-shadow: 0 40px 80px -20px rgba(88, 101, 242, 0.15), 0 0 0 1px rgba(88, 101, 242, 0.05) inset;
        }

        .card h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .card .description {
            color: #8892a8;
            font-size: 15px;
            margin-bottom: 28px;
            font-weight: 400;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #b0bbd4;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            background: rgba(10, 16, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #f0f4ff;
            padding: 14px 18px;
            margin-bottom: 22px;
            outline: none;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: 0.25s ease;
            backdrop-filter: blur(4px);
        }

        input:focus,
        textarea:focus {
            border-color: #5865f2;
            background: rgba(10, 16, 26, 0.8);
            box-shadow: 0 0 0 4px rgba(88, 101, 242, 0.1);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 4px 14px rgba(88, 101, 242, 0.3);
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .status {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            display: none;
            border: 1px solid transparent;
        }

        .status.success {
            display: block;
            border-color: rgba(87, 242, 135, 0.25);
            background: rgba(87, 242, 135, 0.04);
        }

        .status.error {
            display: block;
            border-color: rgba(237, 66, 69, 0.25);
            background: rgba(237, 66, 69, 0.04);
        }

        .status-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .divider {
            margin: 40px 0 30px;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
        }

        .status-check h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .status-check .description {
            color: #8892a8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .check-row {
            display: flex;
            gap: 12px;
        }

        .check-row input {
            flex: 1;
            margin-bottom: 0;
        }

        .btn-secondary {
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.04);
            color: #f0f4ff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .status-result {
            margin-top: 20px;
            padding: 18px 22px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-result.visible {
            display: block;
        }

        .footer {
            text-align: center;
            color: #3d4659;
            padding: 40px 0 30px;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .footer span {
            color: #5865f2;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 30px;
            }

            .card {
                padding: 28px 20px;
            }

            .check-row {
                flex-direction: column;
            }

            .btn-secondary {
                width: 100%;
                justify-content: center;
                text-align: center;
            }

            .header-top {
                justify-content: center;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #05080f;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e2a3a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a3a50;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">

        <header class="header">
            <!-- Верхняя строка: только статус -->
            <div class="header-top">
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">Проверка...</span>
                </div>
            </div>

            <div class="badge">✦ Nexus Appeals</div>
            <h1>Подать апелляцию</h1>
            <p>Защищённая система обработки обращений</p>
        </header>

        <div class="card">
            <h2>📋 Новая апелляция</h2>
            <p class="description">Заполните форму. Все данные передаются по защищённому каналу.</p>

            <form id="appealForm">
                <label for="discord">Discord ID</label>
                <input type="text" id="discord" placeholder="123456789012345678" required />

                <label for="nickname">Discord ник</label>
                <input type="text" id="nickname" placeholder="Rishat" required />

                <label for="reason">Причина апелляции</label>
                <textarea id="reason" placeholder="Опишите ситуацию подробно..." required></textarea>

                <button type="submit" class="btn-primary" id="submitBtn">🚀 Отправить апелляцию</button>
            </form>

            <div id="status" class="status">
                <div class="status-title" id="statusTitle"></div>
                <div id="statusText"></div>
            </div>

            <hr class="divider" />

            <div class="status-check">
                <h2>🔍 Проверить статус</h2>
                <p class="description">Введите номер апелляции, чтобы узнать текущий статус.</p>

                <div class="check-row">
                    <input type="text" id="checkNumber" placeholder="AP-000001" />
                    <button class="btn-secondary" onclick="checkStatus()">Проверить</button>
                </div>

                <div id="statusResult" class="status-result">
                    <div id="statusResultContent"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>✦</span> Nexus Appeals • Защищённая система <span>✦</span>
        </footer>
    </div>

    <script>
        const API_URL = 'https://appeal-site-production.up.railway.app';

        // ==========================================
        // ИНДИКАТОР СТАТУСА
        // ==========================================
        async function checkServerStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            try {
                const response = await fetch(`${API_URL}/`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000) // таймаут 5 секунд
                });

                if (response.ok) {
                    dot.className = 'status-dot online';
                    text.textContent = 'Онлайн';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Офлайн';
                }
            } catch (error) {
                dot.className = 'status-dot offline';
                text.textContent = 'Офлайн';
            }
        }

        // Проверяем при загрузке
        checkServerStatus();

        // Проверяем каждые 30 секунд
        setInterval(checkServerStatus, 30000);

        // ==========================================
        // ОТПРАВКА АПЕЛЛЯЦИИ
        // ==========================================
        const form = document.getElementById('appealForm');
        const statusBox = document.getElementById('status');
        const statusTitle = document.getElementById('statusTitle');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const discord = document.getElementById('discord').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const reason = document.getElementById('reason').value.trim();

            if (!discord || !nickname || !reason) {
                showStatus('error', 'Ошибка', 'Заполните все поля.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';

            try {
                const response = await fetch(`${API_URL}/api/appeals`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discord, nickname, punishment: 'Не указано', reason })
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('success', '✅ Апелляция отправлена!',
                        `Ваш номер: <strong>${result.appealNumber}</strong><br>Сохраните его для проверки статуса.`
                    );
                    form.reset();
                } else {
                    showStatus('error', '❌ Ошибка', result.message || 'Не удалось отправить.');
                }
            } catch {
                showStatus('error', '❌ Ошибка соединения', 'Сервер временно недоступен.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Отправить апелляцию';
            }
        });

        function showStatus(type, title, text) {
            statusBox.className = `status ${type}`;
            statusTitle.textContent = title;
            statusText.innerHTML = text;
        }

        // ==========================================
        // ПРОВЕРКА СТАТУСА
        // ==========================================
        async function checkStatus() {
            const number = document.getElementById('checkNumber').value.trim();
            const resultDiv = document.getElementById('statusResult');
            const contentDiv = document.getElementById('statusResultContent');

            if (!number) {
                resultDiv.style.display = 'block';
                resultDiv.style.border = '1px solid #ed4245';
                contentDiv.innerHTML = '❌ Введите номер апелляции';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/appeals/${number}`);
                const result = await response.json();

                resultDiv.style.display = 'block';

                if (result.success) {
                    const appeal = result.appeal;
                    let statusText, statusColor;

                    switch (appeal.status) {
                        case 'approved':
                            statusText = '🟢 Одобрена';
                            statusColor = '#57f287';
                            break;
                        case 'rejected':
                            statusText = '🔴 Отклонена';
                            statusColor = '#ed4245';
                            break;
                        default:
                            statusText = '🟡 На рассмотрении';
                            statusColor = '#f0b400';
                    }

                    resultDiv.style.border = `1px solid ${statusColor}`;
                    contentDiv.innerHTML = `
                        <div style="font-weight:700;margin-bottom:8px;">Статус: <span style="color:${statusColor};">${statusText}</span></div>
                        <div style="color:#8892a8;margin-bottom:4px;">📝 Причина: ${appeal.reason || '—'}</div>
                        <div style="color:#8892a8;margin-bottom:4px;">📌 Решение: ${appeal.decision_reason || 'Ожидает'}</div>
                        <div style="color:#8892a8;">👤 Модератор: ${appeal.moderator_username || '—'}</div>
                    `;
                } else {
                    resultDiv.style.border = '1px solid #ed4245';
                    contentDiv.innerHTML = '❌ Апелляция не найдена. Проверьте номер.';
                }
            } catch {
                resultDiv.style.display = 'block';
                resultDiv.style.border = '1px solid #ed4245';
                contentDiv.innerHTML = '❌ Ошибка соединения с сервером.';
            }
        }
    </script>

</body>
</html>
